name: Messenger click-trap E2E

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: 'true'
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://127.0.0.1:3100

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Only cache `.next/cache` — Next.js's incremental compiler
      # cache (SWC transforms, webpack module graph, etc.). We do
      # NOT cache the entire `.next/` directory, because doing so
      # would let a stale build slip through whenever a source file
      # outside our cache-key glob changes (utils/, shared/,
      # tailwind.config.js, instrumentation.js, _app.js, ...). The
      # incremental cache is purely an accelerator: `next build`
      # still runs on every workflow run and produces a fresh,
      # source-of-truth `.next/` from the actual current code.
      - name: Cache Next.js incremental build cache (.next/cache)
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-cache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-cache-

      - name: Build Next.js (production)
        run: npm run build

      # Measure the freshly-built bundle and compare against the
      # committed baseline in `docs/bundle-baseline.json`. The check
      # fails the build if the total `.next/static` size grows by more
      # than `thresholds.totalStaticBytesIncreaseAbsolute` bytes or any
      # single page grows by more than `thresholds.perPageIncreaseRatio`
      # (with a small absolute floor to ignore hash-rename noise). If
      # you intentionally grew the bundle, refresh the baseline by
      # committing the new `bundle-current.json` numbers into
      # `docs/bundle-baseline.json` — see `docs/bundle-budget.md`.
      - name: Measure bundle size
        run: node scripts/measure-bundle.js --out bundle-current.json

      - name: Check bundle-size budget
        run: |
          node scripts/check-bundle-budget.js \
            --current bundle-current.json \
            --baseline docs/bundle-baseline.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --mode fail

      - name: Upload bundle-size measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size
          path: bundle-current.json
          if-no-files-found: ignore
          retention-days: 14

      # Hand the built `.next/` to the matrix e2e jobs. Using an
      # artifact (rather than letting each matrix job restore the
      # build cache itself) means we build exactly once per workflow
      # run instead of having all six matrix jobs race to build/cache.
      - name: Upload .next build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: webkit-desktop
            browser: webkit
          - project: chromium-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-mobile
            browser: webkit
          - project: chromium-mobile
            browser: chromium
          - project: firefox-mobile
            browser: firefox

    env:
      CI: 'true'
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://127.0.0.1:3100
      # Tell playwright.config.js to boot `next start` (against the
      # `.next/` artifact downloaded below) instead of `next dev`.
      E2E_PROD_BUILD: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download .next build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run messenger click-trap smoke test (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces / results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
