name: Messenger click-trap E2E

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `pull-requests: write` is needed so the sticky-comment step below
    # can post / update the bundle-size report on the PR conversation.
    # `contents: read` is the default for checkout; spelled out so the
    # narrowed permissions block doesn't accidentally drop it.
    permissions:
      contents: read
      pull-requests: write

    env:
      CI: 'true'
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://127.0.0.1:3100

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Only cache `.next/cache` — Next.js's incremental compiler
      # cache (SWC transforms, webpack module graph, etc.). We do
      # NOT cache the entire `.next/` directory, because doing so
      # would let a stale build slip through whenever a source file
      # outside our cache-key glob changes (utils/, shared/,
      # tailwind.config.js, instrumentation.js, _app.js, ...). The
      # incremental cache is purely an accelerator: `next build`
      # still runs on every workflow run and produces a fresh,
      # source-of-truth `.next/` from the actual current code.
      - name: Cache Next.js incremental build cache (.next/cache)
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-cache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-cache-

      - name: Build Next.js (production)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # `next build` only logs "Attempted import error: ..." as a
      # warning and still exits 0, so a broken import sneaks through
      # the build job and only blows up at request time in
      # `next start` (and then in production). Fail the build here if
      # any such warning shows up so import regressions are caught
      # immediately instead of surfacing as 500s in CI's e2e shards
      # or — worse — in production.
      - name: Fail on "Attempted import error" warnings
        run: |
          if grep -n "Attempted import error" build.log; then
            echo ""
            echo "::error::next build emitted 'Attempted import error' warning(s) above. These cause runtime 500s in production. Fix the imports before merging."
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # Measure the freshly-built bundle and compare against the
      # committed baseline in `docs/bundle-baseline.json`. The check
      # fails the build if the total `.next/static` size grows by more
      # than `thresholds.totalStaticBytesIncreaseAbsolute` bytes or any
      # single page grows by more than `thresholds.perPageIncreaseRatio`
      # (with a small absolute floor to ignore hash-rename noise). If
      # you intentionally grew the bundle, refresh the baseline by
      # committing the new `bundle-current.json` numbers into
      # `docs/bundle-baseline.json` — see `docs/bundle-budget.md`.
      - name: Measure bundle size
        run: node scripts/measure-bundle.js --out bundle-current.json

      - name: Check bundle-size budget
        run: |
          node scripts/check-bundle-budget.js \
            --current bundle-current.json \
            --baseline docs/bundle-baseline.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --markdown-out bundle-report.md \
            --mode fail

      # Mirror the same Markdown report into the PR conversation as a
      # single sticky comment (updated on subsequent runs instead of
      # spamming a new comment per push). Reviewers usually skim the
      # PR thread, not the Checks tab where $GITHUB_STEP_SUMMARY lives,
      # so this is what actually surfaces a regression — or a healthy
      # shrink — in front of them.
      #
      # Runs only on `pull_request` events whose head ref lives in this
      # same repo. Pushes to a branch outside a PR have nowhere to
      # comment, pushes to `main` would just spam an unrelated PR, and
      # PRs opened from forks get a read-only GITHUB_TOKEN regardless of
      # the `permissions:` block above — so the comment step would fail
      # on a fork PR. Skipping it on forks degrades gracefully: the
      # report is still in $GITHUB_STEP_SUMMARY and the build itself
      # still passes/fails on the budget exactly the same way.
      #
      # `if: always()` is important because the check step above exits
      # non-zero on a budget regression, and that regression is exactly
      # the case we most want commented.
      - name: Comment bundle-size report on PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bundle-size-report
          path: bundle-report.md

      - name: Upload bundle-size measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size
          path: bundle-current.json
          if-no-files-found: ignore
          retention-days: 14

      # Hand the built `.next/` to the matrix e2e jobs. Using an
      # artifact (rather than letting each matrix job restore the
      # build cache itself) means we build exactly once per workflow
      # run instead of having all six matrix jobs race to build/cache.
      - name: Upload .next build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: webkit-desktop
            browser: webkit
          - project: chromium-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-mobile
            browser: webkit
          - project: chromium-mobile
            browser: chromium
          - project: firefox-mobile
            browser: firefox
          # Build-time smoke for /, /battle, and the balance / withdrawal
          # page. Runs on the same prebuilt `.next/` artifact, so it
          # adds little extra wall-clock time.
          - project: page-smoke-desktop
            browser: chromium
          - project: page-smoke-mobile
            browser: chromium
          # Regression test for task #393 — locks in the owner-vs-admin
          # allow-list split in pages/api/profiles/[id].ts so a future
          # refactor can't silently re-let users reset their own
          # bankroll / pnl / win rate. The spec carries both behavioural
          # tests (real PATCH + read-back from Postgres) and source-level
          # guardrails. Behavioural tests skip when DATABASE_URL is
          # unset, which is the case for this matrix job — only the
          # supplemental source-level guardrails run here. Wiring a
          # Postgres service so the behavioural suite also runs in CI
          # is filed as a follow-up.
          - project: profile-bankroll-owner-lockout
            browser: chromium

    env:
      CI: 'true'
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://127.0.0.1:3100
      # Tell playwright.config.js to boot `next start` (against the
      # `.next/` artifact downloaded below) instead of `next dev`.
      E2E_PROD_BUILD: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download .next build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run messenger click-trap smoke test (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces / results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  # Auto-refresh `docs/bundle-baseline.json` so the committed baseline
  # tracks whatever just shipped to the default branch. PR runs still
  # compare against the committed baseline — only `push` to the default
  # branch triggers this job. See `docs/bundle-budget.md`.
  refresh-baseline:
    name: Refresh bundle baseline (push to default branch)
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.repository == github.event.repository.full_name
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    # Serialize concurrent baseline refreshes so two near-simultaneous
    # pushes to the default branch don't race each other to push to the
    # same branch. `cancel-in-progress: false` so a queued run still
    # gets to stamp its own measurement.
    concurrency:
      group: bundle-baseline-refresh
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # We push back to the default branch from this job, so we
          # need the default GITHUB_TOKEN persisted in the local git
          # config.
          persist-credentials: true
          # Check out the branch (not the detached event SHA) so we can
          # fetch and rebase against `origin/<branch>` if another commit
          # lands while this job is running.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download bundle-size measurement
        uses: actions/download-artifact@v4
        with:
          name: bundle-size
          path: .

      - name: Refresh docs/bundle-baseline.json
        run: |
          node scripts/refresh-bundle-baseline.js \
            --current bundle-current.json \
            --baseline docs/bundle-baseline.json

      # Regenerate the "Recent baselines" trend table in
      # `docs/bundle-budget.md` so the same commit that bumps the
      # baseline JSON also appends a row to the visible time series.
      # The script reads the working-tree copy of the baseline as the
      # newest entry, so the row reflects this build's just-stamped
      # numbers.
      - name: Refresh bundle history table in docs/bundle-budget.md
        run: |
          node scripts/bundle-history.js \
            --update-doc docs/bundle-budget.md \
            --limit 10

      - name: Commit and push refreshed baseline
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "${BOT_EMAIL}"

          # Freshness guard: only the run for the most recent *code*
          # commit on the default branch is allowed to update the
          # baseline. If a newer push has landed (out-of-order build
          # finish times can put us in this position even with the
          # concurrency group), defer — the newer push's own refresh
          # job will produce the canonical baseline. Bot baseline
          # commits don't count as "newer code", so we skip them when
          # picking the latest non-bot commit.
          is_latest_code_commit() {
            git fetch --quiet origin "${DEFAULT_BRANCH}"
            local latest
            latest="$(
              git log "origin/${DEFAULT_BRANCH}" \
                --format='%H %ae' \
              | awk -v bot="${BOT_EMAIL}" '$2 != bot { print $1; exit }'
            )"
            if [ "${latest}" != "${GITHUB_SHA}" ]; then
              echo "::notice::origin/${DEFAULT_BRANCH} has moved past this run (latest code commit ${latest:0:7}, this run ${GITHUB_SHA:0:7}); deferring baseline refresh to its refresh job."
              return 1
            fi
            return 0
          }

          if ! is_latest_code_commit; then
            exit 0
          fi

          if git diff --quiet -- docs/bundle-baseline.json docs/bundle-budget.md; then
            echo "Bundle baseline (and history table) already match the just-shipped build; nothing to commit."
            exit 0
          fi

          commit_message() {
            git commit \
              -m "chore(bundle): refresh baseline from ${GITHUB_SHA:0:7} [skip ci]" \
              -m "Auto-generated by .github/workflows/messenger-click-trap.yml" \
              -m "after a successful build on ${DEFAULT_BRANCH}. Refreshes" \
              -m "docs/bundle-baseline.json and the 'Recent baselines'" \
              -m "trend table in docs/bundle-budget.md. See docs/bundle-budget.md."
          }

          git add docs/bundle-baseline.json docs/bundle-budget.md
          commit_message

          # Push, retrying if another commit landed on the default
          # branch while we were running. On a non-fast-forward push
          # we re-check the freshness guard (a newer code push wins
          # outright; we exit cleanly), otherwise we lost the race to
          # a parallel bot refresh — reset onto the new tip, re-apply
          # the refresh script (our measurement is still the truth
          # for the SHA this workflow ran on), and try again. Using
          # GITHUB_TOKEN means GitHub Actions does *not* re-trigger
          # this workflow from the resulting commit (recursive
          # triggers are disabled for GITHUB_TOKEN), so the `[skip ci]`
          # marker is belt-and-suspenders.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              echo "Pushed refreshed baseline on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Push rejected on attempt ${attempt}; refetching ${DEFAULT_BRANCH}."
            if ! is_latest_code_commit; then
              exit 0
            fi
            git reset --hard "origin/${DEFAULT_BRANCH}"
            node scripts/refresh-bundle-baseline.js \
              --current bundle-current.json \
              --baseline docs/bundle-baseline.json
            node scripts/bundle-history.js \
              --update-doc docs/bundle-budget.md \
              --limit 10
            if git diff --quiet -- docs/bundle-baseline.json docs/bundle-budget.md; then
              echo "After refetch, baseline (and history table) already match our measurement; nothing left to push."
              exit 0
            fi
            git add docs/bundle-baseline.json docs/bundle-budget.md
            commit_message
            sleep $((attempt * 2))
          done

          echo "::error::Failed to push refreshed baseline after 3 attempts."
          exit 1
